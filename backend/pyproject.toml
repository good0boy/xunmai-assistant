[project]
name = "xunmai-assistant"
version = "0.1.0"
description = "寻脉问诊助手 —— 中医古籍与医案学习参考"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    # 钉 1.12 系列：与 docker-compose 的 qdrant server v1.12.4 同 minor。
    # 1.19 客户端 + 1.12 服务端会间歇性把 dense 向量写成零（见 2026-10-29 日志），
    # 区间放 <2.0 会让 Docker build 时 pip 装上 1.19.x，问题在容器里复活。
    "qdrant-client>=1.12,<1.13",
    "fastembed>=0.4,<1.0",
    "jieba>=0.42,<1.0",
    "mmh3>=5.0,<6.0",
    "pyyaml>=6.0,<7.0",
    "jinja2>=3.1,<4.0",
    "pillow>=11.0,<12.0",
    "python-multipart>=0.0.12,<1.0",
    "tenacity>=9.0,<10.0",
    "apscheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
